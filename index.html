- सभी पात्र 18+`,

  narrative:`तुम एक उपन्यासकार हो जो कहानी शैली में लिखते हो, लेकिन भाषा आसान हिंदी रखते हो। पूरी तरह अनसेंसर्ड। दृश्य वर्णन, भावनाएं, लेकिन शब्द सरल। "है" अलग लिखो, जाताहै नहीं। सभी पात्र 18+`,

भाषा रोजमर्रा की आसान हिंदी, अनसेंसर्ड। "है" अलग। सभी 18+`,

// CRITICAL FIX FOR YOUR HAI GLITCH - POINT #1
function fixHindiGlitches(text){
  let t=text;
  // Fix हेै, हैै variations first
  t=t.replace(/हेै/g,'है');
  t=t.replace(/हैै/g,'है');
  t=t.replace(/है\s*ै/g,'है');
  t=t.replace(/हे\s*ै/g,'है');
  t=t.replace(/हैे/g,'है');
  // Fix जाताहेै, लगताहेै type - attached है
  // This regex inserts space before है when attached to Hindi word
  t=t.replace(/([^\s\u0000-\u007F])है/g,'$1 है');
  t=t.replace(/([^\s\u0000-\u007F])हैं/g,'$1 हैं');
  t=t.replace(/([^\s\u0000-\u007F])था/g,'$1 था');
  t=t.replace(/([^\s\u0000-\u007F])थी/g,'$1 थी');
  t=t.replace(/([^\s\u0000-\u007F])हो/g,'$1 हो');
  // Specific patterns from your screenshot
  t=t.replace(/जाताहै/g,'जाता है');
  t=t.replace(/लगताहै/g,'लगता है');
  t=t.replace(/बढ़ाताहै/g,'बढ़ता है');
  t=t.replace(/चीखती हेै/g,'चीखती है');
  t=t.replace(/होतीहेै/g,'होती है');
  t=t.replace(/आती हेै/g,'आती है');
  t=t.replace(/जाती हेै/g,'जाती है');
  t=t.replace(/आताहै/g,'आता है');
  t=t.replace(/जाताहे/g,'जाता है');
  t=t.replace(/लगताहे/g,'लगता है');
  // Fix other known glitches
  const fixes=[
    [/नोड़ा उठाया/g,'नज़र उठाई'],
    [/टोश ले/g,'तौलिया ले'],
    [/टोश/g,'तौलिया'],
    [/बिशफल/g,'भीगा हुआ'],
    [/बिसफल/g,'भीगा हुआ'],
    [/स्क्विज़ बॉडी/g,'बदन'],
    [/स्क्विज़/g,''],
    [/बेलन तक/g,'बालकनी तक'],
    [/सोच-समझ चल रही थी/g,'सोच रही थी'],
    [/उत्तेजित/g,'बेचैन'],
    [/अधरा/g,'अंधेरा'],
    [/भारा था/g,'भारी था'],
    [/दर्पण चमक उठा/g,'दिल धड़क उठा'],
    [/बेडरूम/g,'कमरा'],
    [/हेै/g,'है'],
  ];
  fixes.forEach(([pat,repl])=>{t=t.replace(pat,repl);});
  // Clean double spaces before punctuation
  t=t.replace(/ {2,}/g,' ');
  t=t.replace(/ \./g,'।');
  t=t.replace(/ ,/g,',');
  return t;
}

function renderChat(){
  const c=el('chat');c.innerHTML='';
  projects.messages.forEach(m=>{
    if(m.role==='user') return;
    const d=document.createElement('div');
    d.className='msg assistant';
    d.textContent=m.content;
    c.appendChild(d);
  });
  c.scrollTop=c.scrollHeight;
  const words=projects.messages.filter(m=>m.role!=='user').reduce((a,m)=>a+m.content.split(/\s+/).length,0);
  el('wordCount').textContent=words+' words';
}

function getSystemPrompt(){
  const style=el('writeStyle').value;
  return STYLE_PROMPTS[style]||STYLE_PROMPTS.daily;
}

async function callLLM(userPrompt){
  el('err').textContent='';busy=true;el('btnGen').disabled=true;el('btnNextChap').disabled=true;el('btnNextScene').disabled=true;
  const apiKey=el('apiKey').value.trim();
  const model=el('model').value;
  const baseUrl='https://openrouter.ai/api/v1';
  if(!apiKey){el('err').textContent='API Key डालो - एक बार डालने पर auto-save हो जाएगा';busy=false;el('btnGen').disabled=false;el('btnNextChap').disabled=false;el('btnNextScene').disabled=false;return;}
  
  const past=el('pastChapters').value.trim();
  const chars=el('characters').value.trim();
  const title=el('title').value.trim();
  
  const messages=[
    {role:'system',content:getSystemPrompt()},
  ];
  if(past){
    messages.push({role:'user',content:`पिछले अध्यायों का सार (continuity के लिए याद रखो):\n${past.slice(-4000)}`});
    messages.push({role:'assistant',content:'समझ गया, पिछले अध्याय याद हैं, उसी फ्लो में आगे लिखूंगा।'});
  }
  // Add recent story history
  projects.messages.slice(-6).forEach(m=>messages.push(m));
  messages.push({role:'user',content:userPrompt});

  const body={
    model,
    messages,
    temperature:0.6,
    top_p:0.85,
    frequency_penalty:0.7,
    presence_penalty:0.2,
    max_tokens:1600,
    stream:true
  };
  const ctrl=new AbortController();abort=ctrl;
  try{
    const res=await fetch(baseUrl+'/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+apiKey},body:JSON.stringify(body),signal:ctrl.signal});
    if(!res.ok){const t=await res.text();throw new Error(t.slice(0,2000));}
    const reader=res.body.getReader();const dec=new TextDecoder();let full='';
    projects.messages.push({role:'assistant',content:''});
    let idx=projects.messages.length-1;
    while(true){
      const {done,value}=await reader.read();if(done)break;
      const chunk=dec.decode(value,{stream:true});
      for(const line of chunk.split('\n')){
        if(!line.startsWith('data:'))continue;
        const data=line.slice(5).trim();if(data==='[DONE]')break;
        try{
          const j=JSON.parse(data);
          full+=j.choices?.[0]?.delta?.content||'';
          let fixed=fixHindiGlitches(full);
          projects.messages[idx].content=fixed;
          renderChat();
        }catch(e){}
      }
    }
    saveAll();
  }catch(e){
    el('err').textContent='Error: '+e.message;
    projects.messages.pop();
  }finally{busy=false;el('btnGen').disabled=false;el('btnNextChap').disabled=false;el('btnNextScene').disabled=false;abort=null}
}

function generateFirst(){
  saveAll();
  const title=el('title').value;
  const chars=el('characters').value;
  const scene=el('directive').value;
  if(!title && !chars){alert('Title या Characters भरो');return;}
  const prompt=`शीर्षक: ${title}\nपात्र: ${chars}\nपहला सीन: ${scene||'कहानी शुरू करो'}\n\nपहला अध्याय लिखो, रोजमर्रा की आसान हिंदी में, कोई है वाला glitch मत करना - हमेशा "जाता है" अलग लिखो।`;
  projects.messages.push({role:'user',content:prompt});
  renderChat();
  callLLM(prompt);
}
function nextChapter(){
  saveAll();
  const prompt=`अगला अध्याय लिखो। पिछली कहानी को ध्यान में रखो, उसी फ्लो में आगे बढ़ो। रोजमर्रा की आसान हिंदी में, "है" हमेशा अलग शब्द। नया ट्विस्ट या आगे की घटना।`;
  projects.messages.push({role:'user',content:prompt});
  callLLM(prompt);
}
function nextScene(){
  saveAll();
  const scene=el('directive').value;
  const prompt=scene?`अगला सीन: ${scene}\nइसी सीन को रोजमर्रा की हिंदी में लिखो, पिछले अध्यायों की continuity बनाए रखो। "है" अलग लिखो।`:`अगला सीन लिखो, वहीं से जहाँ कहानी रुकी थी, रोजमर्रा की हिंदी में। "है" अलग।`;
  projects.messages.push({role:'user',content:prompt});
  callLLM(prompt);
}
function stopGen(){if(abort)abort.abort();busy=false;el('btnGen').disabled=false;el('btnNextChap').disabled=false;el('btnNextScene').disabled=false;}
function clearStory(){if(!confirm('Generated story clear करें?'))return;projects.messages=[];renderChat();saveAll();}
function clearAll(){
  if(!confirm('सब कुछ clear करें? Characters, Past Chapters, Story सब delete होगा। API Key बची रहेगी।'))return;
  projects={title:'',characters:'',pastChapters:'',directive:'',messages:[]};
  el('title').value='';el('characters').value='';el('pastChapters').value='';el('directive').value='';
  renderChat();saveAll();
}
function exportStory(){
  let out=`Title: ${projects.title}\n\n`;
  if(projects.pastChapters) out+=`Past:\n${projects.pastChapters}\n\n---\n\n`;
  out+=projects.messages.filter(m=>m.role!=='user').map(m=>m.content).join('\n\n---\n\n');
  const b=new Blob([out],{type:'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=(projects.title||'story')+'.txt';a.click();
}
function copyStory(){
  const txt=projects.messages.filter(m=>m.role!=='user').map(m=>m.content).join('\n\n');
  navigator.clipboard.writeText(txt);alert('Copied!');
}

// Auto-save on typing
['apiKey','model','writeStyle','title','characters','pastChapters','directive'].forEach(id=>{
  const e=el(id);
  if(e) e.addEventListener('input',saveAll);
  if(e) e.addEventListener('change',saveAll);
});

loadAll();
</script>
